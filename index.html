<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choir Voice Trainer</title>
<meta name="description" content="Choir Voice Trainer — find your voice type, sing in tune with live pitch feedback, read the grand staff and practise SATB parts. Free, runs in your browser.">
<link rel="canonical" href="https://choirtrainer.useful-indeed.com/">
<meta property="og:title" content="Choir Voice Trainer">
<meta property="og:description" content="Find your voice type, sing in tune and read the grand staff. Free, runs in your browser.">
<meta property="og:url" content="https://choirtrainer.useful-indeed.com/">
<link rel="stylesheet" href="useful-indeed/footer.css">
<script src="version-log.js"></script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Noto+Music&family=Cinzel:wght@700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a landing stage with a cartoon choir in white robes, then a journey road; inside each activity one big step at a time, with your own choir member reacting to your voice beside a live grand staff. Single light theme by choice for maximum contrast. */
:root{
  --bg:#111a30; --bg2:#0c1326; --card:#1a2442; --ink:#eef2ff; --muted:#a9b4d2; --line:#2f3b60;
  --accent:#5b8cff; --accent-soft:#223163; --sing:#ff8a2a; --sing-soft:#3b2a1a;
  --good:#34d399; --good-soft:#123629; --bad:#ff6b7d; --gold:#f7c948; --night:#1b2550;
  --paper:#fffdf7; --pink:#14203a; --pmuted:#5a6680; --pgood:#11804d; --psing:#e06a00;
  --font:"Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
  --fun:"Fredoka", "Atkinson Hyperlegible", system-ui, sans-serif;
  --music:"Noto Music", "Bravura Text", "Segoe UI Symbol", "Apple Symbols", serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 15% -5%, #22306a 0%, transparent 60%),radial-gradient(800px 500px at 100% 10%, #2b1f55 0%, transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);line-height:1.5;overflow-x:hidden}
button,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-family:var(--fun);font-weight:600}
p{margin:0}
:focus-visible{outline:4px solid var(--sing);outline-offset:3px}
#bgfx,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:0}
#fx{z-index:60}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:10px 16px 130px}
.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:0 0 auto}
/* Header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.brand{display:flex;gap:12px;align-items:center;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.logo{width:58px;height:58px;display:grid;place-items:center;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(91,140,255,.35))}
.logo svg{width:58px;height:58px}
.brand h1{font-size:1.35rem}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--good);color:var(--good)}
.chip.on .dot{width:10px;height:10px;border-radius:50%;background:var(--good);animation:ping 1.6s ease-out infinite}
.chip.off{border-color:var(--bad);color:var(--bad)}
/* Buttons */
.btn{color:var(--ink);position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 22px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1rem;cursor:pointer;text-align:center;box-shadow:0 3px 0 var(--line);transition:transform .08s, box-shadow .08s, border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:#3d6fe8;border-color:#3d6fe8;color:#fff;box-shadow:0 4px 0 #1e3f99}
.btn.good{background:#13935a;border-color:#13935a;color:#fff;box-shadow:0 4px 0 #0a5534}
.btn.sing{background:#e2690c;border-color:#e2690c;color:#fff;box-shadow:0 4px 0 #8c3f00}
.btn.sing.live{animation:glow 1.4s ease-in-out infinite}
.btn.big{min-height:68px;font-size:1.1rem;padding:12px 26px}
.btn.huge{min-height:78px;font-size:1.35rem;padding:14px 34px;border-radius:24px;font-family:var(--fun)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.stack{display:flex;flex-direction:column;gap:18px}
.center{text-align:center}
.muted{color:var(--muted)}
.lead{font-size:1.15rem}
.huge{font-size:2.4rem;font-weight:700;line-height:1.1;font-family:var(--fun)}
.notice{border-radius:16px;padding:16px 18px;background:var(--sing-soft);border:2px solid var(--sing);font-weight:700}
.notice.blue{background:var(--accent-soft);border-color:var(--accent)}
.notice.green{background:var(--good-soft);border-color:var(--good)}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:flex;gap:14px;align-items:center;font-size:1.05rem;background:var(--bg2);border-radius:16px;padding:12px 14px;animation:fadeUp .45s both}
.tips li:nth-child(2){animation-delay:.08s}.tips li:nth-child(3){animation-delay:.16s}.tips li:nth-child(4){animation-delay:.24s}
.tips .ti{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto;font-size:1.3rem}
.miniprog{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.miniprog>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#5d8bf0);transition:width .5s}
/* Landing */
.landing{display:flex;flex-direction:column;gap:26px}
.lhero{position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#1b2550 0%,#2b3a7a 55%,#3a4c96 100%);color:#fff;padding:28px 22px 0;box-shadow:0 18px 40px rgba(27,37,80,.35)}
.lhero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 110%, rgba(255,214,102,.45), transparent 60%);pointer-events:none}
.ltext{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.eyebrow{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.14);font-weight:700;font-size:.85rem;letter-spacing:.04em}
.ltitle{font-size:clamp(2rem,6vw,3.2rem);font-weight:700;line-height:1.05}
.ltitle span{color:#ffd166}
.ltext p{font-size:1.1rem;color:#dfe6ff;max-width:56ch}
.stage{position:relative;margin-top:18px;padding-bottom:10px}
.row{display:flex;justify-content:center;gap:2%;position:relative;isolation:isolate;padding:0 3%}
.row:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#8a5d33,#5c3d22);border-radius:22px 22px 0 0;z-index:-1;box-shadow:inset 0 4px 0 rgba(255,255,255,.18)}
.row.back{padding:0 10%}
.row.back:after{left:8%;right:8%;background:linear-gradient(180deg,#6f4a29,#4a321c)}
.row.front{margin-top:-4px}
.singer{background:none;border:0;padding:0 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:clamp(62px,17vw,112px);-webkit-tap-highlight-color:transparent;position:relative}
.row.back .singer{width:clamp(56px,15vw,96px)}
.singer .kid{width:100%;height:auto}
.singer .tag{margin-top:-6px;padding:2px 10px;border-radius:99px;background:#fff;color:#14203a;font-weight:700;font-size:.75rem;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);position:relative;z-index:3}
.singer .tag b{color:var(--sing)}
.tapline{position:relative;text-align:center;color:#ffe7a8;font-weight:700;padding:6px 0 14px;font-size:.95rem}
.lctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn.ghostw{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feat{grid-template-columns:1fr}}
.feat .card{display:flex;flex-direction:column;gap:8px;animation:fadeUp .5s both}
.feat .card:nth-child(2){animation-delay:.08s}.feat .card:nth-child(3){animation-delay:.16s}.feat .card:nth-child(4){animation-delay:.24s}
.feat .fi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:1.4rem}
.feat h3{font-size:1.15rem}
.feat .card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap}.feat .card.wide p{flex:1 1 280px;margin:0}.feat .card.wide h3{flex:0 0 auto}
.feat p{color:var(--muted);font-size:.95rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how div{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.how b.n{width:44px;height:44px;border-radius:50%;background:var(--sing);color:#fff;display:grid;place-items:center;font-family:var(--fun);font-size:1.3rem;flex:0 0 auto}
.secttl{font-size:1.6rem;text-align:center}
/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:18px}
.hero h2{font-size:2rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700}
.stat b{font-family:var(--fun);font-size:1.3rem}
.stat .ic{width:1.4em;height:1.4em}
.stat.star{color:var(--gold)} .stat.done{color:var(--good)}
.prog{height:16px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin-top:12px}
.prog>div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--good),#3cc88a);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;font-family:var(--fun);max-width:220px;margin-bottom:4px;animation:fadeUp .6s .3s both;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;margin-left:-8px;bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hero-kid{display:flex;flex-direction:column;align-items:center}
.hero-kid .kid{width:118px;height:auto}
.road{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.road:before{content:"";position:absolute;left:31px;top:20px;bottom:20px;border-left:6px dotted var(--line)}
.stop{position:relative;animation:fadeUp .5s both}
.node{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--card);border:4px solid var(--line);display:grid;place-items:center;font-weight:700;font-family:var(--fun);z-index:1}
.stop.done .node{background:var(--good);border-color:var(--good);color:#fff}
.stop.next .node{border-color:var(--accent);color:var(--accent);animation:ring 1.8s infinite}
.stepcard{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 18px 14px 26px;cursor:pointer;transition:transform .15s, box-shadow .15s, border-color .15s}
.stepcard:hover{transform:translateX(4px);border-color:var(--accent);box-shadow:0 8px 22px rgba(29,79,184,.14)}
.stop.next .stepcard{border-color:var(--accent);box-shadow:0 8px 22px rgba(29,79,184,.14)}
.aicon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:1.5rem;flex:0 0 auto}
.stepcard h3{font-size:1.2rem}
.stepcard p{color:var(--muted);font-size:.9rem}
.stepcard .go{font-weight:700;color:var(--accent);white-space:nowrap;display:flex;gap:6px;align-items:center}
.minis{display:flex;gap:2px;color:var(--line)}
.minis .on{color:var(--gold)}
.minis .ic{width:1em;height:1em}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
.settings label{font-weight:700;display:block;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:52px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;transition:background .15s, color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
select.big option{background:#1a2442;color:#eef2ff}
select.big{min-height:56px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;width:100%}
/* Wizard */
.wizhead{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.wizhead .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wizhead h2{font-size:1.6rem;display:flex;gap:12px;align-items:center}
.wizhead h2 .aicon{width:48px;height:48px;border-radius:15px;font-size:1.2rem}
.dots{display:flex;gap:6px}
.dots span{height:12px;flex:1;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.dots span.past,.dots span.ok{background:var(--good)}
.dots span.miss{background:repeating-linear-gradient(45deg,#6b5a2a 0 6px,#3b3420 6px 12px)}
.dots span.now{background:var(--accent-soft)}
.dots span.now:after{content:"";position:absolute;inset:0;background:var(--accent);animation:fillbar .6s ease-out forwards;transform-origin:left}
.stepnum{font-weight:700;color:var(--accent);font-family:var(--fun);font-size:1.1rem}
.steptitle{font-size:1.5rem}
.stepcardx{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
.wizfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.wizfoot .in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.wizfoot .btn{flex:1;max-width:320px}
/* Staff */
.staffbox{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.staff{display:block;margin:0 auto;width:100%;height:auto;max-width:760px;min-width:300px;overflow:visible}
svg.staff .ln{stroke:var(--pink);stroke-width:1.4}
svg.staff .ledger{stroke:var(--pink);stroke-width:1.6}
svg.staff .clef{font-family:var(--music);fill:var(--pink)}
svg.staff .acc{font-family:var(--music);fill:var(--pink);font-size:30px}
svg.staff .nacc{font-family:var(--music);font-size:28px;fill:var(--pink)}
svg.staff .nh{fill:var(--pink);transform-box:fill-box;transform-origin:center;transition:fill .2s}
svg.staff .nh.me{fill:var(--psing)}
svg.staff .lyric{font-family:var(--fun);font-weight:600;font-size:25px;fill:var(--pink);text-anchor:middle;transition:fill .2s}
svg.staff .top{font-family:var(--font);font-weight:700;font-size:15px;fill:var(--pmuted);text-anchor:middle}
svg.staff .tag{font-family:var(--font);font-weight:700;font-size:14px;fill:var(--pmuted)}
svg.staff .tag.me{fill:var(--psing)}
svg.staff .partlbl{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--pmuted)}
svg.staff .col{animation:noteIn .5s both}
svg.staff .hl{fill:#ffead6;opacity:0;transition:opacity .25s}
svg.staff .col.cur .hl{opacity:1}
svg.staff .col.cur .nh{fill:var(--psing);animation:pulse 1s ease-in-out infinite}
svg.staff .col.cur .lyric{fill:var(--psing)}
svg.staff .col.hit .nh, svg.staff .col.hit .lyric{fill:var(--pgood)}
svg.staff .col.hit .nh{animation:pop .5s}
svg.staff .col.miss .nh, svg.staff .col.miss .lyric{fill:#c0392b}
svg.staff .col.miss{animation:shake .45s}
svg.staff .live circle{fill:var(--psing)}
svg.staff .live .halo{opacity:.25;transform-box:fill-box;transform-origin:center;animation:halo 1.2s ease-out infinite}
svg.staff .live text{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--psing);text-anchor:middle}
svg.staff .live.ok circle{fill:var(--pgood)}
svg.staff .live.ok text{fill:var(--pgood)}
svg.staff .trail{fill:none;stroke:var(--psing);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
svg.staff .trail.ok{stroke:var(--pgood)}
/* Choir members (adults in ivory robes) */
.kid{overflow:visible;display:block}
.kid .k-robe{fill:var(--robe,#f4efe3);stroke:var(--robe-s,#c2b79f);stroke-width:1.5;stroke-linejoin:round}
.kid .k-pleat{stroke:var(--pleat,#dcd2bb);stroke-width:1.3;fill:none;stroke-linecap:round}
.kid .k-binder{fill:var(--book,#fbfaf6);stroke:var(--book-s,#b9b2a2);stroke-width:1.4}
.kid .k-spine{fill:var(--spine,#e7e2d6)}
.kid .k-lines{fill:none;stroke:rgba(110,60,40,.45);stroke-width:.9;stroke-linecap:round}
.kid .k-nose{fill:none;stroke:rgba(0,0,0,.28);stroke-width:1.3;stroke-linecap:round}
.kid .k-brow,.kid .k-sad{fill:none;stroke-width:1.9;stroke-linecap:round}
.kid .k-eyes{fill:#1a1a2e;transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.kid .k-shine{fill:#fff}
.kid .k-happy,.kid .k-smile,.kid .k-frown{fill:none;stroke:#4a2323;stroke-width:1.8;stroke-linecap:round}
.kid .k-cheek{fill:#ff8fa3;opacity:.3;transition:opacity .2s}
.kid .k-mouth{fill:#6b1c27}
.kid .k-glow{fill:#3fd18b;opacity:0;transition:opacity .3s}
.kid .k-happy,.kid .k-frown,.kid .k-sad,.kid .k-mouth,.kid .k-cheer{display:none}
.kid .k-sway{transform-box:view-box;transform-origin:60px 198px;animation:sway 4.5s ease-in-out infinite}
.kid .k-head{transform-box:view-box;transform-origin:60px 62px}
.kid .k-note{font-family:var(--music);fill:var(--gold);font-size:16px;opacity:0}
.kid.singing .k-mouth{display:inline}
.kid.singing .k-smile{display:none}
.kid.singing .k-head{animation:headbob .8s ease-in-out infinite}
.kid.singing .k-note{animation:noteFly 1.6s ease-out infinite}
.kid.singing .k-note.n2{animation-delay:.8s}
.kid.ok .k-glow{opacity:.2}
.kid.ok .k-cheek{opacity:.7}
.kid.ok .k-eyes{display:none}
.kid.ok .k-happy{display:inline}
.kid.yay{animation:jump .8s}
.kid.yay .k-cheer,.kid.yay .k-happy{display:inline}
.kid.yay .k-hold,.kid.yay .k-eyes{display:none}
.kid.oops .k-sad,.kid.oops .k-frown{display:inline}
.kid.oops .k-brow,.kid.oops .k-smile,.kid.oops .k-mouth{display:none}
.kid.oops .k-head{animation:shake .5s}
.kid.face{overflow:hidden}
.kid.face .k-sway{animation:none}
.kid.face .k-note,.kid.face .k-glow{display:none}
/* Setup page */
.setup{display:flex;flex-direction:column;gap:18px}
.sethead{display:flex;flex-direction:column;gap:6px;animation:fadeUp .5s both}
.sethead h2{font-size:2.1rem}
.setcard{animation:fadeUp .5s both}
.setcard:nth-of-type(2){animation-delay:.08s}.setcard:nth-of-type(3){animation-delay:.16s}
.setcard h3{font-size:1.35rem;display:flex;align-items:center;gap:10px}
.stepn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e2690c;color:#fff;font-size:1.05rem;flex:0 0 auto}
.charpick{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:stretch}
.preview{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;background:radial-gradient(circle at 50% 30%, #34468a, #141c38 75%);border:2px solid var(--line);border-radius:24px;padding:16px 10px 14px;overflow:hidden}
.preview:before{content:"";position:absolute;left:10%;right:10%;bottom:44px;height:18px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(4px)}
.preview .kid{position:relative;width:150px;height:auto}
.preview b{font-family:var(--fun);font-size:1.5rem;position:relative}
.preview span{color:var(--muted);font-weight:700;position:relative}
.chargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.charbtn{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ink);transition:transform .15s, border-color .15s;-webkit-tap-highlight-color:transparent}
.charbtn:hover{transform:translateY(-3px);border-color:var(--accent)}
.charbtn .kid{width:72%;height:auto}
.charbtn b{font-size:.92rem;font-family:var(--fun)}
.charbtn small{font-size:.72rem;color:var(--muted);font-weight:700}
.charbtn[aria-pressed="true"]{border-color:var(--sing);box-shadow:0 0 0 4px var(--sing-soft);background:#2a2240}
.partgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.partbtn{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column}
.partbtn b{font-size:1rem}
.partbtn small{color:var(--muted);font-weight:700}
.partbtn.find{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.partbtn[aria-pressed="true"]{border-color:var(--sing);background:#2a2240;box-shadow:0 0 0 4px var(--sing-soft)}
.setrow{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--bg2)}
.setrow .lbl b{display:block;font-size:1.05rem}
.setrow .lbl small{color:var(--muted)}
.aa{font-family:var(--fun);color:var(--gold);margin-left:6px}
/* You box */
.youbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--bg2);border-radius:20px;padding:12px 16px}
.youl{display:flex;flex-direction:column;align-items:center;gap:2px}
.youl .kid{width:74px;height:auto}
.yousyl{font-family:var(--fun);font-size:1.6rem;font-weight:600;min-width:90px;text-align:center;line-height:1}
.tuner{position:relative;height:30px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.tuner .tz{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:2px solid var(--good);border-right:2px solid var(--good);transition:background .2s}
.tuner.ok .tz{background:rgba(52,211,153,.4)}
.tuner .tn{position:absolute;top:3px;bottom:3px;width:12px;margin-left:-6px;border-radius:6px;background:#dfe5f5;left:50%;transition:left .1s linear, background .2s}
.tuner .tn.ok{background:var(--good);box-shadow:0 0 0 4px rgba(17,128,77,.25)}
.tunerlbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700;gap:6px}
.youhint{font-weight:700;font-size:1.05rem;min-height:1.5em;margin-top:4px}
.sig{display:inline-flex;gap:3px;align-items:flex-end;height:18px;margin-left:8px;vertical-align:middle}
.sig i{display:block;width:6px;border-radius:2px;background:var(--line)}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:11px}.sig i:nth-child(3){height:16px}
.sig.l1 i:nth-child(1), .sig.l2 i:nth-child(-n+2), .sig.l3 i{background:var(--good)}
.say{font-size:1.25rem;font-weight:700;text-align:center;min-height:1.6em;font-family:var(--fun)}
.say.good{color:var(--good);animation:pop .45s}
.say.bad{color:var(--bad)}
.score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.score span{display:inline-flex;gap:6px;align-items:center;padding:8px 16px;border-radius:99px;background:var(--bg2);font-weight:700}
.score span:empty{display:none}
.floaty{position:fixed;z-index:70;pointer-events:none;font-family:var(--fun);font-weight:700;font-size:1.6rem;color:var(--good);animation:floatUp 1.1s ease-out forwards}
/* Breathing */
.breath{position:relative;display:grid;place-items:center;height:300px}
.circle{position:relative;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #9bbcff, var(--accent));display:grid;place-items:center;color:#fff;font-weight:700;font-size:2.2rem;font-family:var(--fun);transform:scale(1);transition:transform 1s ease-in-out;box-shadow:0 0 40px rgba(29,79,184,.35)}
.circle.out{background:radial-gradient(circle at 35% 35%, #8fe0b8, var(--good))}
.ripple{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);opacity:0}
.breath.on .ripple{animation:ripple 3s ease-out infinite}
.breath.on .ripple.r2{animation-delay:1s}.breath.on .ripple.r3{animation-delay:2s}
.bigclock{font-size:4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1;font-family:var(--fun)}
.airbar{height:28px;border-radius:99px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.airbar>div{height:100%;width:100%;background:linear-gradient(90deg,#8fe0b8,var(--good));transition:width .1s linear}
.beats{display:flex;gap:14px;justify-content:center}
.beats span{width:58px;height:58px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:1.2rem;font-family:var(--fun);transition:background .08s}
.beats span.on{background:var(--sing);color:#fff;animation:pop .3s}
/* Choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.choices .btn{font-size:1.4rem;min-height:80px;font-family:var(--fun);animation:fadeUp .35s both}
.choices .btn.right{background:var(--good);border-color:var(--good);color:#fff;animation:pop .45s}
.choices .btn.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .45s}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.keybtn{color:#14203a;border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;transition:transform .15s}
.keybtn:hover{transform:translateY(-3px)}
.keybtn[aria-pressed="true"]{border-color:var(--sing);box-shadow:0 0 0 4px var(--sing-soft)}
.keybtn svg{width:100%;height:auto;min-width:0}
.vtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vtbtn{color:var(--ink);border:2px solid var(--line);background:var(--bg2);border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
.vtbtn .kid{width:54px;height:54px;flex:0 0 auto}
.vtbtn b{display:block;font-size:1rem}
.vtbtn span{color:var(--muted);font-size:.8rem}
.vtbtn[aria-pressed="true"]{border-color:var(--sing);background:var(--sing-soft)}
.reveal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.reveal .kid{width:130px;height:auto;animation:popIn .8s cubic-bezier(.2,1.5,.4,1) both}
.result-big{font-size:2.1rem;font-weight:700;color:var(--accent);font-family:var(--fun);animation:pop .6s}
.chordres{display:flex;flex-direction:column;gap:8px}
.chordres div{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:14px;background:var(--bg2);font-weight:700;animation:fadeUp .4s both}
.meterbig{position:relative;height:34px;border-radius:99px;background:var(--bg2);border:2px solid var(--line);overflow:hidden}
.meterbig>div{height:100%;width:0;background:linear-gradient(90deg,var(--sing),var(--gold),var(--good));transition:width .15s}
.duo{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.duo .kid{width:96px;height:auto}
/* Finish modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,9,20,.65);display:grid;place-items:center;padding:16px;animation:fade .3s both}
.modal .card{max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:zoomIn .5s cubic-bezier(.2,1.4,.4,1) both}
.modal .kid{width:104px;height:auto}
.bigstars{display:flex;gap:10px;color:var(--line)}
.bigstars .ic{width:52px;height:52px}
.bigstars .on{color:var(--gold);animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars .on:nth-child(2){animation-delay:.25s}.bigstars .on:nth-child(3){animation-delay:.5s}
/* Keyframes */
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(17,128,77,.6)}100%{box-shadow:0 0 0 10px rgba(17,128,77,0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(29,79,184,.5)}100%{box-shadow:0 0 0 14px rgba(29,79,184,0)}}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #9c4a00,0 0 0 0 rgba(224,106,0,.5)}50%{box-shadow:0 4px 0 #9c4a00,0 0 0 12px rgba(224,106,0,0)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes noteIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes halo{from{transform:scale(1);opacity:.4}to{transform:scale(2.4);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px)}60%{transform:translateY(0)}75%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes headbob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes noteFly{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-38px) rotate(20deg)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-70px) scale(1.2)}}
@keyframes ripple{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.dress{display:grid;gap:14px;margin-top:6px}
.dlbl{margin:0 0 6px;font-weight:700}.dlbl small{color:var(--muted);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font:inherit;font-size:.7rem;font-weight:700;cursor:pointer;width:62px}
.swatches span{width:40px;height:40px;border-radius:50%;background:var(--sw);border:3px solid var(--line);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18);transition:transform .15s}
.swatches button[aria-pressed="true"] span{border-color:var(--sing);transform:scale(1.12);box-shadow:0 0 0 4px var(--sing-soft)}
.swatches button[aria-pressed="true"]{color:var(--ink)}
.books{display:flex;flex-wrap:wrap;gap:10px}
.books button{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;font-weight:700;cursor:pointer;width:78px;text-align:center}
.books .bk{position:relative;width:46px;height:56px;border-radius:4px 7px 7px 4px;border:2px solid;display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.books .bk i{position:absolute;left:0;top:0;bottom:0;width:9px;border-radius:3px 0 0 3px}
.books .bk em{font-style:normal;color:#e3b23c;font-size:1.1rem;font-family:"Noto Music",serif}
.books button[aria-pressed="true"] .bk{outline:3px solid var(--sing);outline-offset:3px}
.books button[aria-pressed="true"]{color:var(--ink)}
#bgmChip.on{border-color:var(--good);color:var(--good)}
.timecard{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:18px;align-items:center;margin-bottom:8px}
.timecard .tbig b{display:block;white-space:nowrap;font-family:var(--fun);font-size:2.2rem;color:var(--gold)}.timecard .tbig span{color:var(--muted);font-weight:700}
.timecard ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}.timecard li{display:flex;gap:10px;align-items:flex-start}.timecard li .ic{flex:0 0 auto;width:22px;height:22px;color:var(--gold);margin-top:2px}
@media (max-width:640px){.timecard{grid-template-columns:1fr}}
.phonetip .maic,.musicask .maic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--gold);color:#3a2a00;font-size:2rem}
#bgmChip.wait{border-color:var(--gold);color:var(--gold);animation:pulseChip 1.6s ease-in-out infinite}
@keyframes pulseChip{50%{box-shadow:0 0 0 6px rgba(247,201,72,.18)}}
.vgrp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.vgrp.three{grid-template-columns:repeat(3,1fr)}
.vgrp button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.vgrp button small{color:var(--muted);font-weight:600;font-size:.82rem}
.vgrp button[aria-pressed="true"]{border-color:var(--sing);background:#2a2240;box-shadow:0 0 0 4px var(--sing-soft)}
.readme{font-size:1.2rem;font-weight:700;padding:14px 18px;border-radius:16px;background:var(--bg2);border:2px dashed var(--line);text-align:center}
.vlog{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.vlog span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--bg2);border:2px solid var(--c);color:var(--c);font-weight:700;animation:fadeUp .3s both}
.vlog span b{color:var(--ink)}.vlog span small{font-size:.72rem;opacity:.9}
.vfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.vfacts div{padding:12px 14px;border-radius:16px;background:var(--bg2);border:2px solid var(--line)}
.vfacts div.wide{grid-column:1/-1;border-color:#b794f6}
.vfacts small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}.vfacts b{font-family:var(--fun);font-size:1.4rem}
.rangechart{width:100%;height:auto;background:var(--bg2);border-radius:18px;border:2px solid var(--line)}
.confpill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:800;font-size:.85rem}
.confpill.c-high{background:#123629;color:var(--good)}.confpill.c-medium{background:#3a3214;color:var(--gold)}.confpill.c-low{background:#3a1820;color:var(--bad)}
.stepcard .partial{display:block;color:var(--gold);font-weight:700;margin-top:4px}
.certbanner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:22px;background:linear-gradient(135deg,#1d4fb8,#2b1f55);border:2px solid var(--accent);margin:0 0 18px}
.certbanner.gold{background:linear-gradient(135deg,#6b4a00,#2b1f55);border-color:var(--gold)}
.certbanner .cb-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold);color:#3a2a00;font-size:1.5rem}
.certbanner div{flex:1 1 240px}.certbanner b{display:block;font-family:var(--fun);font-size:1.2rem}.certbanner small{color:#d7def5;font-weight:600}
.modal{overflow-y:auto}
.certmodal{place-items:start center;padding-top:4vh;padding-bottom:4vh}
.modal .card.certcard{max-width:860px;width:100%}
.certform[hidden],.certview[hidden]{display:none!important}
.certform{display:grid;gap:10px;text-align:left}
.certform input{min-height:56px;padding:0 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-size:1.15rem;font-weight:700}
.certform input:focus{outline:none;border-color:var(--accent)}
.todolist{display:grid;gap:8px;width:100%}
.btn.todo{justify-content:flex-start;text-align:left;width:100%}
.btn.todo span{flex:1;display:flex;flex-direction:column}.btn.todo small{color:var(--muted);font-weight:600}
.certone{width:100%;margin-bottom:14px}.certone h3{font-family:var(--fun);margin:0 0 8px}
.certview img{width:100%;height:auto;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:block;margin-bottom:12px}
.small{font-size:.85rem}
@media (max-width:640px){ .hsgrid{grid-template-columns:repeat(2,1fr)} .hschoice .hsign{width:72px} .vgrp.three{grid-template-columns:1fr} .swatches button{width:54px} }

.rhsvg{width:100%;height:auto;display:block}

.choices .rhchoice svg{max-width:300px;margin:0 auto}
.rhbox{position:relative}
.rhmarks{position:relative;height:16px;margin-top:-6px}
.rhmarks span{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--line)}
.rhmarks span.g{background:var(--good)}.rhmarks span.o{background:var(--gold)}.rhmarks span.b{background:var(--bad)}
.tapbtn{display:block;width:min(100%,360px);margin:6px auto 0;min-height:110px;border-radius:28px;border:0;background:linear-gradient(135deg,#a21caf,#ff8a2a);color:#fff;font:700 2rem var(--fun);letter-spacing:.1em;cursor:pointer;touch-action:manipulation;box-shadow:0 12px 30px rgba(162,28,175,.35);user-select:none;-webkit-user-select:none}

/* ===== Grand staff ===== */
const HS = 7;

function staff(key, cols, o = {}){

  for (let i = 0; i < 5; i++){ s += `<line class="ln" x1="${LX}" x2="${W - 8}" y1="${yT(30 + 2 * i)}" y2="${yT(30 + 2 * i)}"/><line class="ln" x1="${LX}" x2="${W - 8}" y1="${yB(18 + 2 * i)}" y2="${yB(18 + 2 * i)}"/>`; }
  s += `<line class="ln" x1="${LX}" x2="${LX}" y1="${yT(38)}" y2="${yB(18)}" style="stroke-width:2.5"/><line class="ln" x1="${W - 8}" x2="${W - 8}" y1="${yT(38)}" y2="${yB(18)}"/>`;
  s += `<text class="clef" x="${LX + 6}" y="${yT(32)}" font-size="56">𝄞</text><text class="clef" x="${LX + 6}" y="${yB(20)}" font-size="56">𝄢</text>`;
  if (!o.noParts) s += `<text class="partlbl" x="2" y="${yT(34) + 5}">S A</text><text class="partlbl" x="2" y="${yB(22) + 5}">T B</text>`;

      s += `<g transform="translate(${x} ${y})"><ellipse class="nh${n.me ? ' me' : ''}" cx="0" cy="0" rx="8.6" ry="6.3" transform="rotate(-20)"/></g>`;

function staffApi(box, key, liveStaff){

    col(i, cls){ $$('.col', svg).forEach(g => { if (+g.dataset.col === i){ g.classList.remove('cur', 'hit', 'miss'); if (cls) g.classList.add(cls); } }); },
    colEl(i){ return $(`.col[data-col="${i}"] .nh`, svg); },

    }
  };
}

/* ===== Sing-and-check exercise ===== */
function singCheck(el, api, o){
  const v = vt(), st = staffOf(v.part), hd = homeDo(o.key, v);
  const cols = o.notes.map((m, i) => ({ notes: [{ m, st }], lyric: o.lyrics ? o.lyrics[i] : sylTxt(m, o.key, hd) }));
  el.innerHTML = `<div class="stack">
    <div class="staffbox">${staff(o.key, cols, { live: true })}</div>
    <p class="say" data-s="say">${o.hearFirst ? 'Press <b>1 · Listen</b>. Then press <b>2 · Sing</b>.' : 'Press <b>1 · Hear do</b>. Read the notes, then press <b>2 · Sing</b>.'}</p>
    <div class="btnrow"><button class="btn big" data-s="listen">${B('play', o.hearFirst ? '1 · Listen' : '1 · Hear do')}</button><button class="btn big sing" data-s="sing">${B('mic', '2 · Sing')}</button></div>
    <div class="btnrow" data-s="self" hidden><button class="btn big good" data-s="yes">${B('check', 'I matched it')}</button><button class="btn big" data-s="no">${B('x', 'Not yet')}</button></div>
    ${youHTML()}
  </div>`;
  const sa = staffApi($('.staffbox', el), o.key, st);
  const say = (t, cls = '') => { const p = $('[data-s="say"]', el); p.innerHTML = t; p.className = 'say ' + cls; };
  const singBtn = $('[data-s="sing"]', el), listenBtn = $('[data-s="listen"]', el);
  const R = { on: false, idx: 0, hold: null, lastOk: 0, start: 0, hits: 0, done: false };
  const gap = o.notes.length > 1 ? 0.75 : 1.4;
  listenBtn.onclick = () => {
    if (o.hearFirst){ seq(o.notes, gap); if (!R.on){ o.notes.forEach((_, i) => later(() => { if (!R.on){ sa.clear(); sa.col(i, 'cur'); } }, 50 + i * gap * 1000)); later(() => { if (!R.on) sa.clear(); }, o.notes.length * gap * 1000 + 100); } }
    else { A(); stopSound(); tone(refDo(o.key, v), ctx.currentTime + 0.05, 1.2, 0.22); }
  };
  const finish = () => {
    R.on = false; R.done = true; singBtn.classList.remove('live');
    const n = o.notes.length, all = R.hits === n;
    if (all){ say(`★ Wonderful! You sang ${n === 1 ? 'it' : 'all ' + n + ' notes'} right!`, 'good'); fanfare(); confetti(innerWidth / 2, innerHeight / 2.5, 70); kidReact(el, 'yay'); }
    else { say(`You got ${R.hits} of ${n}. Press Listen and try again.`, 'bad'); boop(); kidReact(el, 'oops'); }
    singBtn.innerHTML = B('redo', 'Try again');
    o.onDone && o.onDone({ hits: R.hits, total: n });
  };
  const startSing = async () => {
    const ok = await micOn();
    if (!ok){
      say(o.hearFirst ? 'Sing it out loud now ♪ Then press Listen again to compare.' : 'Sing it out loud now ♪ Then press Listen to check.', '');
      $('[data-s="self"]', el).hidden = false;
      if (!o.hearFirst){ listenBtn.innerHTML = B('play', 'Hear the answer'); listenBtn.onclick = () => seq(o.notes, 0.75); }
      return;
    }
    stopSound(); sa.clear(); singBtn.classList.add('live');
    Object.assign(R, { on: true, idx: 0, hold: null, start: performance.now(), hits: 0, done: false });

    const target = R.on ? o.notes[R.idx] : (R.done ? null : o.notes[0]);
    const ok = m != null && target != null && Math.abs(centsTo(m, target)) <= S.tol;
    sa.live(m, ok); youUpdate(el, m, target, o.key, hd);
    if (!R.on) return;

}
/* 30-round game wrapper */
function drill({ title, intro, gen, hearFirst = true, rounds = ROUNDS }){

const allDone = () => ACTS.every(a => S.done[a.id]);
const allPerfect = () => ACTS.every(a => (S.stars[a.id] || 0) >= 3);

const ACTS = [];
const act = a => { a.steps.forEach(st => { st.graded = /\bscore\(/.test(st.render.toString()); }); ACTS.push(a); return a; };
/* ===== Progress: a step only counts when it was really done. Skipping is allowed, but gives no progress and no stars. =====
   Graded step (quiz, singing game): counts after half of its rounds are answered (skipped rounds count as wrong),
   or after one full try for single-try games. Other steps: count after you use them (press Play, Start…), or after
   a few seconds of reading when the step has no buttons. */
const spKey = (a, i) => a.id + ':' + i;
function stepInfo(a, i){
  const st = a.steps[i], r = S.sp[spKey(a, i)] || {};
  if (st.graded){
    if (st.need){ const t = r.t || 0; return { graded: true, ok: t >= Math.ceil(st.need / 2), ratio: Math.min(1, (r.h || 0) / Math.max(t, st.need)), left: Math.max(0, Math.ceil(st.need / 2) - t) }; }
    return { graded: true, ok: (r.n || 0) >= 1, ratio: r.t ? Math.min(1, r.h / r.t) : 0, left: (r.n || 0) >= 1 ? 0 : 1 };
  }
  return { graded: false, ok: !!r.e, ratio: 1 };
}
function actProgress(a){
  const info = a.steps.map((_, i) => stepInfo(a, i)), okN = info.filter(x => x.ok).length, gr = info.filter(x => x.graded);
  const ratio = gr.length ? gr.reduce((s2, x) => s2 + x.ratio, 0) / gr.length : 1;
  return { info, okN, total: info.length, complete: okN === info.length, ratio, stars: okN === info.length ? (ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : 1) : 0 };
}
function stepBetter(a2, b2, st){ // which saved try is better for this step
  const k = r => { const t = r.t || 0; const ok = st.need ? t >= Math.ceil(st.need / 2) : (r.n || 0) >= 1; const ratio = st.need ? (r.h || 0) / Math.max(t, st.need) : (t ? r.h / t : 0); return [ok ? 1 : 0, ratio, t]; };
  const x = k(a2), y = k(b2); for (let i = 0; i < 3; i++){ if (x[i] !== y[i]) return x[i] > y[i] ? a2 : b2; } return a2;
}

const PR = { S: [61, 77], A: [56, 72], T: [49, 67], B: [41, 60] };
const PC = { S: 69, A: 63, T: 57, B: 49 };
const CH = { I: { r: 0, t: [0,4,7], n: 'Do chord' }, ii: { r: 2, t: [2,5,9], n: 'Re chord' }, iii: { r: 4, t: [4,7,11], n: 'Mi chord' }, IV: { r: 5, t: [5,9,0], n: 'Fa chord' }, V: { r: 7, t: [7,11,2], n: 'Sol chord' }, V7: { r: 7, t: [7,11,2,5], n: 'Sol 7 chord' }, vi: { r: 9, t: [9,0,4], n: 'La chord' } };
function voiceChord(ck, key, prev){
  const v = vt(), ch = CH[ck], pc = key.pc;
  const rng = { ...PR, [v.part]: [v.lo + 1, v.hi - 2] }, ctr = { ...PC, [v.part]: (v.lo + v.hi) / 2 };
  const cand = p => { const a = []; for (let m = rng[p][0]; m <= rng[p][1]; m++){ const x = mod(m - pc, 12); if (p === 'B' ? x === ch.r : ch.t.includes(x)) a.push(m); } return a; };
  const C = { S: cand('S'), A: cand('A'), T: cand('T'), B: cand('B') }, ref = prev || ctr;
  const go = strict => { let best = null, bc = Infinity;
    for (const b of C.B) for (const t of C.T) for (const a of C.A) for (const s of C.S){
      if (!(s > a && a > t && t > b)) continue;
      if (strict && (s - a > 12 || a - t > 12 || new Set([s, a, t, b].map(m => mod(m - pc, 12))).size < 3)) continue;
      const vv = { S: s, A: a, T: t, B: b }; let c = 0; for (const p in vv){ c += Math.abs(vv[p] - ref[p]); if (prev) c += 0.3 * Math.abs(vv[p] - ctr[p]); }
      if (c < bc){ bc = c; best = vv; } }
    return best; };
  return go(true) || go(false);
}
function chordCols(key, voicings, keys){
  const me = vt().part;
  return voicings.map((v, i) => ({ notes: ['S', 'A', 'T', 'B'].map(p => ({ m: v[p], st: staffOf(p), me: p === me, tag: p })), lyric: sylTxt(v[me], key, homeDo(key)), top: keys ? CH[keys[i]].n : '' }));
}
const others = v => ['S', 'A', 'T', 'B'].filter(p => p !== vt().part).map(p => v[p]);
const CHORD_KEYS = ['I', 'IV', 'V', 'vi', 'ii'];

function runAct(a, start = 0){
  bgmWant(false);
  let i = start;
  const show = () => {
    teardown();
    const st = a.steps[i], key = spKey(a, i), base = Object.assign({}, S.sp[key] || {}), run = { h: 0, t: 0, n: 0 };
    const keep = () => { const best = st.graded ? Object.assign({}, stepBetter(run, base, st)) : {}; best.e = !!(base.e || run.e); S.sp[key] = best; save(); markDots(); };
    app.innerHTML = `<section class="wizhead"><div class="top"><button class="btn" id="toHome">${B('map', 'My journey')}</button><span class="stepnum">Step ${i + 1} of ${a.steps.length}</span></div><h2>${aicon(a)}${a.title}</h2><div class="dots">${a.steps.map((_, k) => `<span data-k="${k}"></span>`).join('')}</div></section><section class="card stack stepcardx"><h3 class="steptitle">${st.title}</h3><div id="stepBody"></div><p class="notice green" id="stepHint" hidden></p></section>`;
    $('#toHome').onclick = journey;
    const subs = [];
    const api = {
      onPitch(fn){ MIC.subs.add(fn); subs.push(fn); },
      resetPitch(){ subs.splice(0).forEach(f => MIC.subs.delete(f)); },
      hint(t){ const h = $('#stepHint'); if (h){ h.textContent = t; h.hidden = false; } },
      score(h, t){ run.h += h; run.t += t; run.n++; keep(); },
      engage(){ if (!run.e){ run.e = true; keep(); } },
    };
    const markDots = () => $$('.dots span').forEach(d => { const k = +d.dataset.k, ok = stepInfo(a, k).ok; d.className = (k === i ? 'now ' : '') + (ok ? 'ok' : k < i ? 'miss' : ''); d.title = ok ? 'Done' : k < i ? 'Skipped, not counted yet' : ''; });
    cleanups.push(() => subs.forEach(f => MIC.subs.delete(f)));
    st.render($('#stepBody'), api);
    markDots();
    if (!st.graded && !st.manual){ // an info step counts when you use it, or after a few seconds of reading if it has nothing to press
      const body = $('#stepBody'), use = e => { if (e.target.closest('button, input, select, label, [role="button"]')) api.engage(); };
      body.addEventListener('click', use); body.addEventListener('change', use);
      if (!$$('button, input, select', body).length) later(() => api.engage(), 4000);
    }
    $('#foot').hidden = false;
    $('#backBtn').innerHTML = i === 0 ? B('map', 'Journey') : B('left', 'Back');
    $('#nextBtn').innerHTML = i === a.steps.length - 1 ? B('check', 'Finish') : `<span>Next</span>${ic('right')}`;
    $('#backBtn').onclick = () => { if (i === 0) journey(); else { i--; show(); } };
    $('#nextBtn').onclick = () => { if (i === a.steps.length - 1){ teardown(); $('#foot').hidden = true; finishAct(a); } else { i++; show(); } };
    window.scrollTo(0, 0);
  };
  show();
}

async function offerDownload(){
  const wrap = $('#dlwrap'); if (!wrap || !window.__host || !window.__host.use) return;
  let dl = null; try { dl = await window.__host.use('downloads'); } catch(e){}
  if (!dl || !document.body.contains(wrap)) return;
  wrap.innerHTML = `For automatic checking with the microphone: <button class="btn" id="dlb" style="margin-top:8px">${B('down', 'Get the full version')}</button> then open the file in Chrome, Edge or Safari.`;
  $('#dlb').onclick = async () => {
    let html = null;
    try { const r = await fetch('index.html'); if (r.ok) html = await r.text(); } catch(e){}
    if (!html || !html.includes('Choir Voice Trainer')) html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    try { await dl.save({ filename: 'choir-voice-trainer.html', data: html }); } catch(e){}
  };
}

$('#bgmChip').onclick = () => { bgmAsked = true; if (BGM.on){ S.bgm = false; save(); bgmStop(); } else { S.bgm = true; save(); A(); (ctx.state === 'running' ? Promise.resolve() : ctx.resume()).then(bgmStart).catch(() => {}); } };
initBg();
applySize(); updChips(); landing();
})();
