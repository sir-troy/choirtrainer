<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choir Voice Trainer</title>
<meta name="description" content="Choir Voice Trainer — find your voice type, sing in tune with live pitch feedback, read the grand staff and practise SATB parts. Free, runs in your browser.">
<link rel="canonical" href="https://choirtrainer.useful-indeed.com/">
<meta property="og:title" content="Choir Voice Trainer">
<meta property="og:description" content="Find your voice type, sing in tune and read the grand staff. Free, runs in your browser.">
<meta property="og:url" content="https://choirtrainer.useful-indeed.com/">
<link rel="stylesheet" href="useful-indeed/footer.css">
<script src="version-log.js"></script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* Layout idea: a landing stage with a cartoon choir in white robes, then a journey road; inside each activity one big step at a time, with your own choir member reacting to your voice beside a live grand staff. Single light theme by choice for maximum contrast. */
:root{
  --bg:#111a30; --bg2:#0c1326; --card:#1a2442; --ink:#eef2ff; --muted:#a9b4d2; --line:#2f3b60;
  --accent:#5b8cff; --accent-soft:#223163; --sing:#ff8a2a; --sing-soft:#3b2a1a;
  --good:#34d399; --good-soft:#123629; --bad:#ff6b7d; --gold:#f7c948; --night:#1b2550;
  --paper:#fffdf7; --pink:#14203a; --pmuted:#5a6680; --pgood:#11804d; --psing:#e06a00;
  --font:"Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
  --fun:"Fredoka", "Atkinson Hyperlegible", system-ui, sans-serif;
  --music:"Noto Music", "Bravura Text", "Segoe UI Symbol", "Apple Symbols", serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 15% -5%, #22306a 0%, transparent 60%),radial-gradient(800px 500px at 100% 10%, #2b1f55 0%, transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);line-height:1.5;overflow-x:hidden}
button,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-family:var(--fun);font-weight:600}
p{margin:0}
:focus-visible{outline:4px solid var(--sing);outline-offset:3px}
#bgfx,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:0}
#fx{z-index:60}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:10px 16px 130px}
.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:0 0 auto}
/* Header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.brand{display:flex;gap:12px;align-items:center;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.logo{width:58px;height:58px;display:grid;place-items:center;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(91,140,255,.35))}
.logo svg{width:58px;height:58px}
.brand h1{font-size:1.35rem}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--good);color:var(--good)}
.chip.on .dot{width:10px;height:10px;border-radius:50%;background:var(--good);animation:ping 1.6s ease-out infinite}
.chip.off{border-color:var(--bad);color:var(--bad)}
/* Buttons */
.btn{color:var(--ink);position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 22px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1rem;cursor:pointer;text-align:center;box-shadow:0 3px 0 var(--line);transition:transform .08s, box-shadow .08s, border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:#3d6fe8;border-color:#3d6fe8;color:#fff;box-shadow:0 4px 0 #1e3f99}
.btn.good{background:#13935a;border-color:#13935a;color:#fff;box-shadow:0 4px 0 #0a5534}
.btn.sing{background:#e2690c;border-color:#e2690c;color:#fff;box-shadow:0 4px 0 #8c3f00}
.btn.sing.live{animation:glow 1.4s ease-in-out infinite}
.btn.big{min-height:68px;font-size:1.1rem;padding:12px 26px}
.btn.huge{min-height:78px;font-size:1.35rem;padding:14px 34px;border-radius:24px;font-family:var(--fun)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.stack{display:flex;flex-direction:column;gap:18px}
.center{text-align:center}
.muted{color:var(--muted)}
.lead{font-size:1.15rem}
.huge{font-size:2.4rem;font-weight:700;line-height:1.1;font-family:var(--fun)}
.notice{border-radius:16px;padding:16px 18px;background:var(--sing-soft);border:2px solid var(--sing);font-weight:700}
.notice.blue{background:var(--accent-soft);border-color:var(--accent)}
.notice.green{background:var(--good-soft);border-color:var(--good)}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:flex;gap:14px;align-items:center;font-size:1.05rem;background:var(--bg2);border-radius:16px;padding:12px 14px;animation:fadeUp .45s both}
.tips li:nth-child(2){animation-delay:.08s}.tips li:nth-child(3){animation-delay:.16s}.tips li:nth-child(4){animation-delay:.24s}
.tips .ti{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto;font-size:1.3rem}
.miniprog{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.miniprog>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#5d8bf0);transition:width .5s}
/* Landing */
.landing{display:flex;flex-direction:column;gap:26px}
.lhero{position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#1b2550 0%,#2b3a7a 55%,#3a4c96 100%);color:#fff;padding:28px 22px 0;box-shadow:0 18px 40px rgba(27,37,80,.35)}
.lhero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 110%, rgba(255,214,102,.45), transparent 60%);pointer-events:none}
.ltext{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.eyebrow{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.14);font-weight:700;font-size:.85rem;letter-spacing:.04em}
.ltitle{font-size:clamp(2rem,6vw,3.2rem);font-weight:700;line-height:1.05}
.ltitle span{color:#ffd166}
.ltext p{font-size:1.1rem;color:#dfe6ff;max-width:56ch}
.stage{position:relative;margin-top:18px;padding-bottom:10px}
.row{display:flex;justify-content:center;gap:2%;position:relative;isolation:isolate;padding:0 3%}
.row:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#8a5d33,#5c3d22);border-radius:22px 22px 0 0;z-index:-1;box-shadow:inset 0 4px 0 rgba(255,255,255,.18)}
.row.back{padding:0 10%}
.row.back:after{left:8%;right:8%;background:linear-gradient(180deg,#6f4a29,#4a321c)}
.row.front{margin-top:-4px}
.singer{background:none;border:0;padding:0 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:clamp(62px,17vw,112px);-webkit-tap-highlight-color:transparent;position:relative}
.row.back .singer{width:clamp(56px,15vw,96px)}
.singer .kid{width:100%;height:auto}
.singer .tag{margin-top:-6px;padding:2px 10px;border-radius:99px;background:#fff;color:#14203a;font-weight:700;font-size:.75rem;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);position:relative;z-index:3}
.singer .tag b{color:var(--sing)}
.tapline{position:relative;text-align:center;color:#ffe7a8;font-weight:700;padding:6px 0 14px;font-size:.95rem}
.lctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn.ghostw{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.feat .card{display:flex;flex-direction:column;gap:8px;animation:fadeUp .5s both}
.feat .card:nth-child(2){animation-delay:.08s}.feat .card:nth-child(3){animation-delay:.16s}.feat .card:nth-child(4){animation-delay:.24s}
.feat .fi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:1.4rem}
.feat h3{font-size:1.15rem}
.feat p{color:var(--muted);font-size:.95rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how div{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.how b.n{width:44px;height:44px;border-radius:50%;background:var(--sing);color:#fff;display:grid;place-items:center;font-family:var(--fun);font-size:1.3rem;flex:0 0 auto}
.secttl{font-size:1.6rem;text-align:center}
/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:18px}
.hero h2{font-size:2rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700}
.stat b{font-family:var(--fun);font-size:1.3rem}
.stat .ic{width:1.4em;height:1.4em}
.stat.star{color:var(--gold)} .stat.done{color:var(--good)}
.prog{height:16px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin-top:12px}
.prog>div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--good),#3cc88a);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;font-family:var(--fun);max-width:220px;margin-bottom:4px;animation:fadeUp .6s .3s both;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;margin-left:-8px;bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hero-kid{display:flex;flex-direction:column;align-items:center}
.hero-kid .kid{width:118px;height:auto}
.road{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.road:before{content:"";position:absolute;left:31px;top:20px;bottom:20px;border-left:6px dotted var(--line)}
.stop{position:relative;animation:fadeUp .5s both}
.node{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--card);border:4px solid var(--line);display:grid;place-items:center;font-weight:700;font-family:var(--fun);z-index:1}
.stop.done .node{background:var(--good);border-color:var(--good);color:#fff}
.stop.next .node{border-color:var(--accent);color:var(--accent);animation:ring 1.8s infinite}
.stepcard{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 18px 14px 26px;cursor:pointer;transition:transform .15s, box-shadow .15s, border-color .15s}
.stepcard:hover{transform:translateX(4px);border-color:var(--accent);box-shadow:0 8px 22px rgba(29,79,184,.14)}
.stop.next .stepcard{border-color:var(--accent);box-shadow:0 8px 22px rgba(29,79,184,.14)}
.aicon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:1.5rem;flex:0 0 auto}
.stepcard h3{font-size:1.2rem}
.stepcard p{color:var(--muted);font-size:.9rem}
.stepcard .go{font-weight:700;color:var(--accent);white-space:nowrap;display:flex;gap:6px;align-items:center}
.minis{display:flex;gap:2px;color:var(--line)}
.minis .on{color:var(--gold)}
.minis .ic{width:1em;height:1em}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
.settings label{font-weight:700;display:block;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:52px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;transition:background .15s, color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
select.big option{background:#1a2442;color:#eef2ff}
select.big{min-height:56px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;width:100%}
/* Wizard */
.wizhead{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.wizhead .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wizhead h2{font-size:1.6rem;display:flex;gap:12px;align-items:center}
.wizhead h2 .aicon{width:48px;height:48px;border-radius:15px;font-size:1.2rem}
.dots{display:flex;gap:6px}
.dots span{height:12px;flex:1;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.dots span.past{background:var(--good)}
.dots span.now{background:var(--accent-soft)}
.dots span.now:after{content:"";position:absolute;inset:0;background:var(--accent);animation:fillbar .6s ease-out forwards;transform-origin:left}
.stepnum{font-weight:700;color:var(--accent);font-family:var(--fun);font-size:1.1rem}
.steptitle{font-size:1.5rem}
.stepcardx{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
.wizfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.wizfoot .in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.wizfoot .btn{flex:1;max-width:320px}
/* Staff */
.staffbox{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.staff{display:block;margin:0 auto;width:100%;height:auto;max-width:760px;min-width:300px;overflow:visible}
svg.staff .ln{stroke:var(--pink);stroke-width:1.4}
svg.staff .ledger{stroke:var(--pink);stroke-width:1.6}
svg.staff .clef{font-family:var(--music);fill:var(--pink)}
svg.staff .acc{font-family:var(--music);fill:var(--pink);font-size:30px}
svg.staff .nacc{font-family:var(--music);font-size:28px;fill:var(--pink)}
svg.staff .nh{fill:var(--pink);transform-box:fill-box;transform-origin:center;transition:fill .2s}
svg.staff .nh.me{fill:var(--psing)}
svg.staff .lyric{font-family:var(--fun);font-weight:600;font-size:25px;fill:var(--pink);text-anchor:middle;transition:fill .2s}
svg.staff .top{font-family:var(--font);font-weight:700;font-size:15px;fill:var(--pmuted);text-anchor:middle}
svg.staff .tag{font-family:var(--font);font-weight:700;font-size:14px;fill:var(--pmuted)}
svg.staff .tag.me{fill:var(--psing)}
svg.staff .partlbl{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--pmuted)}
svg.staff .col{animation:noteIn .5s both}
svg.staff .hl{fill:#ffead6;opacity:0;transition:opacity .25s}
svg.staff .col.cur .hl{opacity:1}
svg.staff .col.cur .nh{fill:var(--psing);animation:pulse 1s ease-in-out infinite}
svg.staff .col.cur .lyric{fill:var(--psing)}
svg.staff .col.hit .nh, svg.staff .col.hit .lyric{fill:var(--pgood)}
svg.staff .col.hit .nh{animation:pop .5s}
svg.staff .col.miss .nh, svg.staff .col.miss .lyric{fill:#c0392b}
svg.staff .col.miss{animation:shake .45s}
svg.staff .live circle{fill:var(--psing)}
svg.staff .live .halo{opacity:.25;transform-box:fill-box;transform-origin:center;animation:halo 1.2s ease-out infinite}
svg.staff .live text{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--psing);text-anchor:middle}
svg.staff .live.ok circle{fill:var(--pgood)}
svg.staff .live.ok text{fill:var(--pgood)}
svg.staff .trail{fill:none;stroke:var(--psing);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
svg.staff .trail.ok{stroke:var(--pgood)}
/* Choir members (adults in ivory robes) */
.kid{overflow:visible;display:block}
.kid .k-robe{fill:#f4efe3;stroke:#c2b79f;stroke-width:1.5;stroke-linejoin:round}
.kid .k-pleat{stroke:#dcd2bb;stroke-width:1.3;fill:none;stroke-linecap:round}
.kid .k-binder{fill:#fbfaf6;stroke:#b9b2a2;stroke-width:1.4}
.kid .k-spine{fill:#e7e2d6}
.kid .k-lines{fill:none;stroke:rgba(110,60,40,.45);stroke-width:.9;stroke-linecap:round}
.kid .k-nose{fill:none;stroke:rgba(0,0,0,.28);stroke-width:1.3;stroke-linecap:round}
.kid .k-brow,.kid .k-sad{fill:none;stroke-width:1.9;stroke-linecap:round}
.kid .k-eyes{fill:#1a1a2e;transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.kid .k-shine{fill:#fff}
.kid .k-happy,.kid .k-smile,.kid .k-frown{fill:none;stroke:#4a2323;stroke-width:1.8;stroke-linecap:round}
.kid .k-cheek{fill:#ff8fa3;opacity:.3;transition:opacity .2s}
.kid .k-mouth{fill:#6b1c27}
.kid .k-glow{fill:#3fd18b;opacity:0;transition:opacity .3s}
.kid .k-happy,.kid .k-frown,.kid .k-sad,.kid .k-mouth,.kid .k-cheer{display:none}
.kid .k-sway{transform-box:view-box;transform-origin:60px 198px;animation:sway 4.5s ease-in-out infinite}
.kid .k-head{transform-box:view-box;transform-origin:60px 62px}
.kid .k-note{font-family:var(--music);fill:var(--gold);font-size:16px;opacity:0}
.kid.singing .k-mouth{display:inline}
.kid.singing .k-smile{display:none}
.kid.singing .k-head{animation:headbob .8s ease-in-out infinite}
.kid.singing .k-note{animation:noteFly 1.6s ease-out infinite}
.kid.singing .k-note.n2{animation-delay:.8s}
.kid.ok .k-glow{opacity:.2}
.kid.ok .k-cheek{opacity:.7}
.kid.ok .k-eyes{display:none}
.kid.ok .k-happy{display:inline}
.kid.yay{animation:jump .8s}
.kid.yay .k-cheer,.kid.yay .k-happy{display:inline}
.kid.yay .k-hold,.kid.yay .k-eyes{display:none}
.kid.oops .k-sad,.kid.oops .k-frown{display:inline}
.kid.oops .k-brow,.kid.oops .k-smile,.kid.oops .k-mouth{display:none}
.kid.oops .k-head{animation:shake .5s}
.kid.face{overflow:hidden}
.kid.face .k-sway{animation:none}
.kid.face .k-note,.kid.face .k-glow{display:none}
/* Setup page */
.setup{display:flex;flex-direction:column;gap:18px}
.sethead{display:flex;flex-direction:column;gap:6px;animation:fadeUp .5s both}
.sethead h2{font-size:2.1rem}
.setcard{animation:fadeUp .5s both}
.setcard:nth-of-type(2){animation-delay:.08s}.setcard:nth-of-type(3){animation-delay:.16s}
.setcard h3{font-size:1.35rem;display:flex;align-items:center;gap:10px}
.stepn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e2690c;color:#fff;font-size:1.05rem;flex:0 0 auto}
.charpick{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:stretch}
.preview{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;background:radial-gradient(circle at 50% 30%, #34468a, #141c38 75%);border:2px solid var(--line);border-radius:24px;padding:16px 10px 14px;overflow:hidden}
.preview:before{content:"";position:absolute;left:10%;right:10%;bottom:44px;height:18px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(4px)}
.preview .kid{position:relative;width:150px;height:auto}
.preview b{font-family:var(--fun);font-size:1.5rem;position:relative}
.preview span{color:var(--muted);font-weight:700;position:relative}
.chargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

      item++; cur = { ok: false }; const me = cur;
      api.resetPitch(); clearTimers();

      singCheck($('[data-d="box"]', el), api, { key: g.key, notes: g.notes, lyrics: g.lyrics, hearFirst: g.hearFirst ?? hearFirst, auto, onDone: r => { if (r.hits === r.total && !me.ok){ me.ok = true; right++; upd(); later(() => { if (cur === me) make(true); }, 1800); } } });

function playAlong({ title, how, degs, lyrics, glide = false, gap = 0.45 }){
  const offs = [0, 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1, 0];
  return { title, render(el){
    const v = vt(); const start = v.lo + 1;
    el.innerHTML = `<div class="stack">${tips(how)}<div class="duo">${kidSVG(avatar())}<div class="stack" style="gap:10px"><div class="score"><span data-p="r">Ready · ${offs.length} rounds, up and back down</span></div><div class="miniprog"><div data-p="bar"></div></div></div></div><div class="staffbox" data-p="st"></div><div class="btnrow"><button class="btn big sing" data-p="go">${B('play', 'Start · sing along')}</button><button class="btn big" data-p="stop">${B('stop', 'Stop')}</button></div></div>`;
    let ms = [], key = KEYS[0];
    const kid = $('.duo .kid', el);
    const draw = r => {
      const tonic = start + offs[r]; key = keyForPc(tonic);
      ms = degs.map(d => dToMidi(d, tonic));
      $('[data-p="st"]', el).innerHTML = staff(key, ms.map((m, i) => ({ notes: [{ m, st: staffOf(v.part) }], lyric: lyrics ? lyrics[i] : sylTxt(m, key, tonic) })), { colW: 56 });
    };
    draw(0);
    let running = false;
    const go = r => {
      if (!running) return;
      if (r >= offs.length){ running = false; kid.classList.remove('singing'); $('[data-p="r"]', el).textContent = '★ Done! Well sung.'; fanfare(); confetti(); kidReact(kid, 'yay'); return; }
      draw(r); $('[data-p="r"]', el).textContent = `Round ${r + 1} of ${offs.length} · ${r < 6 ? 'going higher' : 'coming back down'}`; $('[data-p="bar"]', el).style.width = (100 * (r + 1) / offs.length) + '%';
      const sa = staffApi($('[data-p="st"]', el), key, staffOf(v.part));
      A(); let t = ctx.currentTime + 0.1; const t0 = t;
      if (glide){ for (let i = 0; i < ms.length - 1; i++){ tone(ms[i], t, gap * 2, 0.2, ms[i + 1]); const k = i; later(() => { sa.clear(); sa.col(k, 'cur'); kid.classList.add('singing'); }, (t - t0 + 0.1) * 1000); t += gap * 2; } }
      else { chord([ms[0], ms[0] + 4, ms[0] + 7], t, 0.8, 0.1); t += 1.0; ms.forEach((m, k) => { tone(m, t, gap * 0.95, 0.22); later(() => { sa.clear(); sa.col(k, 'cur'); kid.classList.add('singing'); }, (t - t0 + 0.1) * 1000); t += gap; }); }
      later(() => { kid.classList.remove('singing'); sa.clear(); }, (t - t0 + 0.2) * 1000);
      later(() => go(r + 1), (t - ctx.currentTime + 1.0) * 1000);
    };
    $('[data-p="go"]', el).onclick = () => { stopSound(); clearTimers(); running = true; go(0); };
    $('[data-p="stop"]', el).onclick = () => { running = false; clearTimers(); stopSound(); kid.classList.remove('singing'); $('[data-p="r"]', el).textContent = 'Stopped'; };
  } };
}

const PR = { S: [61, 77], A: [56, 72], T: [49, 67], B: [41, 60] };
const PC = { S: 69, A: 63, T: 57, B: 49 };
const CH = { I: { r: 0, t: [0,4,7], n: 'Do chord' }, ii: { r: 2, t: [2,5,9], n: 'Re chord' }, IV: { r: 5, t: [5,9,0], n: 'Fa chord' }, V: { r: 7, t: [7,11,2], n: 'Sol chord' }, vi: { r: 9, t: [9,0,4], n: 'La chord' } };
function voiceChord(ck, key, prev){
  const v = vt(), ch = CH[ck], pc = key.pc;
  const rng = { ...PR, [v.part]: [v.lo + 1, v.hi - 2] }, ctr = { ...PC, [v.part]: (v.lo + v.hi) / 2 };
  const cand = p => { const a = []; for (let m = rng[p][0]; m <= rng[p][1]; m++){ const x = mod(m - pc, 12); if (p === 'B' ? x === ch.r : ch.t.includes(x)) a.push(m); } return a; };
  const C = { S: cand('S'), A: cand('A'), T: cand('T'), B: cand('B') }, ref = prev || ctr;
  const go = strict => { let best = null, bc = Infinity;
    for (const b of C.B) for (const t of C.T) for (const a of C.A) for (const s of C.S){
      if (!(s > a && a > t && t > b)) continue;
      if (strict && (s - a > 12 || a - t > 12 || new Set([s, a, t, b].map(m => mod(m - pc, 12))).size < 3)) continue;
      const vv = { S: s, A: a, T: t, B: b }; let c = 0; for (const p in vv){ c += Math.abs(vv[p] - ref[p]); if (prev) c += 0.3 * Math.abs(vv[p] - ctr[p]); }
      if (c < bc){ bc = c; best = vv; } }
    return best; };
  return go(true) || go(false);
}
function chordCols(key, voicings, keys){
  const me = vt().part;
  return voicings.map((v, i) => ({ notes: ['S', 'A', 'T', 'B'].map(p => ({ m: v[p], st: staffOf(p), me: p === me, tag: p })), lyric: sylTxt(v[me], key, homeDo(key)), top: keys ? CH[keys[i]].n : '' }));
}

    $('#foot').hidden = false;
    $('#backBtn').innerHTML = i === 0 ? B('map', 'Journey') : B('left', 'Back');
    $('#nextBtn').innerHTML = i === a.steps.length - 1 ? B('check', 'Finish') : `<span>Next</span>${ic('right')}`;
    $('#backBtn').onclick = () => { if (i === 0) journey(); else { i--; show(); } };
    $('#nextBtn').onclick = () => { if (i === a.steps.length - 1){ teardown(); $('#foot').hidden = true; finishAct(a, sc); } else { i++; show(); } };
    window.scrollTo(0, 0);
  };
  show();
}

async function offerDownload(){
  const wrap = $('#dlwrap'); if (!wrap || !window.__host || !window.__host.use) return;
  let dl = null; try { dl = await window.__host.use('downloads'); } catch(e){}
  if (!dl || !document.body.contains(wrap)) return;
  wrap.innerHTML = `For automatic checking with the microphone: <button class="btn" id="dlb" style="margin-top:8px">${B('down', 'Get the full version')}</button> then open the file in Chrome, Edge or Safari.`;
  $('#dlb').onclick = async () => {
    let html = null;
    try { const r = await fetch('index.html'); if (r.ok) html = await r.text(); } catch(e){}
    if (!html || !html.includes('Choir Voice Trainer')) html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    try { await dl.save({ filename: 'choir-voice-trainer.html', data: html }); } catch(e){}
  };
}

$('#vtChip').onclick = () => journey();
$('#micChip').onclick = () => micOn();
initBg();
applySize(); updChips(); landing();
})();
